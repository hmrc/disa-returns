openapi: 3.0.3

info:
  version: 1.0.0
  title: ISA Returns API
  description: |
    # Overview
    Use this API to submit monthly reports of cumulative current tax year ISA subscription data.
    Your organisation must be approved by HMRC as an ISA manager to access the API.
    From the Beta phase onwards, your organisation must also be enrolled for digital ISA reporting.
    
    # Supported use cases

    You can use this API to:

    - submit monthly reports containing cumulative current tax year subscription data, including transfers and withdrawals
    - submit a declaration confirming that the data for the current reporting window has been submitted
    - retrieve reconciliation results using cursor pagination

    # Integration requirements
    
    The integration requirements are as follows:

    - REST API using JSON and [Newline Delimited JSON (NDJSON)](https://github.com/ndjson/ndjson-spec) over HTTPS
    - each monthly report must be generated to cover all ISA subscription activity from the 6th of one month through 
    the 5th of the following month
    - you must submit the monthly report between the 6th and the 19th (by 23:59) of the specific month in which the 
    reporting period ends
    - authentication uses the OAuth 2.0 authorization code grant
    - all API calls require an HMRC-assigned unique identifier (Z-Reference) for each approved ISA manager

    # Support

    Before contacting us, find out if there is planned API downtime or a technical issue by checking 
    [HMRC API Platform Status](https://api-platform-status.production.tax.service.gov.uk/).
    
    For support with onboarding, the API access, or the 
    [HMRC Developer sandbox](https://developer.service.hmrc.gov.uk/api-documentation/docs/testing) 
    queries, submit your request using the 
    [online support form](https://developer.service.hmrc.gov.uk/devhub-support/start) 
    or email your queries to [SDSTeam@hmrc.gov.uk](mailto:SDSTeam@hmrc.gov.uk).
    
    When submitting a request, users should provide details of any available error information to help with the 
    troubleshooting and resolution of the issue.

servers:
  - url: https://test-api.service.hmrc.gov.uk/obligations/declaration/isa/return
    description: Sandbox
  - url: https://api.service.hmrc.gov.uk/obligations/declaration/isa/return
    description: Production

tags:
  - name: Submit monthly report
    description: |
      To submit a monthly report with data records, you must follow a two-step process:
      
      1. Submit one or more batches of account records.
      2. Declare the monthly report as complete after all account records have been submitted.
      
      You must complete these steps in order. A report is only considered submitted once you have declared it complete. 
      You cannot amend the monthly report once the declaration has been submitted.

      **Note:**
      When there is no data to submit for a specific period, you may submit a nil report. It acts as a declaration 
      alongside the general declaration and will override any previous submission for the same period.


  - name: Check report results
    description: |
      After a monthly report is marked complete and the reporting window closes, HMRC will begin a process that 
      reconciles your submission against other ISA managers' submissions. This will involve validation against business 
      rules and checks on each investor's eligibility and their annual ISA subscription limits.
      
      You can use the ‘Get report reconciliation results’ endpoint to retrieve the reconciliation results when the 
      report is available. This report is a compilation of the rejected records with details of any reconciliation 
      issues. Results are cursor paginated to support large datasets.

paths:
  /monthly/{zReference}:
    post:
      summary: Submit monthly report data
      description: |
        Use the ‘Submit monthly report data‘ endpoint to upload a batch of account records. A batch is a single payload 
        containing multiple records for the specified monthly report. The payload size of each request must not exceed 
        10 MB.
      
        The API checks whether:
        
        - the reporting window is closed
        - a declaration has already been submitted for the current reporting period
        
        If either of the above conditions are satisfied, then the API returns a `403 Forbidden` response.
        
        If the request to submit the monthly report is permitted, then:
        
        - the payload is validated against the expected structure to prevent invalid or incomplete data from being 
        submitted
        - business validation rules are not applied at this stage
          
        If structural validation fails, the API returns a `400 Bad Request` response. For example, a missing National 
        Insurance number or account number will cause the request to fail. Valid records will be processed only after 
        the report is marked as complete.
          
        A successful submission returns a `204 No Content` response.
          
        Submit all data batches before completing the monthly report.
        
        Note: The examples shown here are limited by the OpenAPI Specification. Actual payloads must be sent as 
        [NDJSON](https://github.com/ndjson/ndjson-spec), with one object per line. A trailing newline is optional.

      operationId: submitMonthlyReport
      tags:
        - Submit monthly report
      security:
        - userRestricted:
            - write:isa-returns
      parameters:
        - name: zReference
          in: path
          description: |
            A unique identifier assigned by HMRC to each approved ISA manager. Format: 'Zxxxx'.
          required: true
          style: simple
          explode: false
          schema:
            pattern: ^[zZ][0-9]{4}$
            type: string
            example: Z1234
        - $ref: '#/components/parameters/acceptHeader'
        - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        required: true
        content:
          application/x-ndjson:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/investorDetails'
            examples:
              lifetimeIsaSubscription:
                $ref: '#/components/examples/lifetimeIsaSubscription'
              lifetimeIsaClosure:
                $ref: '#/components/examples/lifetimeIsaClosure'
              standardIsaSubscription:
                $ref: '#/components/examples/standardIsaSubscription'
              standardIsaClosure:
                $ref: '#/components/examples/standardIsaClosure'
      responses:
        204:
          description: Submission accepted. No content returned.
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/badSubmissionGeneral'
                  - $ref: '#/components/schemas/badSubmissionComplex'
                  - $ref: '#/components/schemas/badRequestParameters'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    title: Error Code Type
                    type: string
                    description: Error Code
                    enum:
                      - UNAUTHORIZED
                  message:
                    type: string
                    example: Unauthorized
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/forbiddenSingleError'
                  - $ref: '#/components/schemas/forbiddenMultipleErrors'
        500:
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    title: Error Code Type
                    type: string
                    description: Error Code
                    enum:
                      - INTERNAL_SERVER_ERROR
                  message:
                    type: string
                    example: "Unexpected Error"
  /monthly/{zReference}/declaration:
    post:
      summary: Declare monthly report as complete
      description: |
        Use the ‘Declare monthly report as complete’ endpoint to confirm that all data has been submitted.
        
        Declaring a report as complete is a legal confirmation that you have met your monthly reporting obligation by 
        submitting all available data within the deadline. However, it does not confirm that the submitted data is 
        correct. Once the monthly declaration is submitted, no further data can be submitted for that specific month.
        
        The API checks whether:
        
        - the reporting window is closed
        - a declaration has already been submitted for the current reporting period

        If either of the above conditions are satisfied, then the API returns a `403 Forbidden` response.
        
        If the submission completes successfully, the response includes a box ID for the 
        [Push-Pull Notifications Service (PPNS)](https://developer.service.hmrc.gov.uk/api-documentation/docs/api/service/push-pull-notifications-api/1.0). 
        The box ID can be used to query the PPNS API directly to retrieve the reconciliation results.

      operationId: declareMonthlyReportComplete
      tags:
        - Submit monthly report
      security:
        - userRestricted:
            - write:isa-returns
      parameters:
        - name: zReference
          in: path
          description: |
            A unique identifier assigned by HMRC to each approved ISA manager. Format: 'Zxxxx'.
          required: true
          style: simple
          explode: false
          schema:
            pattern: ^[zZ][0-9]{4}$
            type: string
            example: Z1234
        - $ref: '#/components/parameters/acceptHeader'
        - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nilReturn:
                  type: boolean
                  description: |
                   If `true`, this indicates a nil return: there is no data to report for the period.
                   It acts as a declaration alongside the general declaration and will override any previous submission for the same period.
                   If `false`, the API expects data records to have been submitted separately before completion.
              required: [ nilReturn ]
      responses:
        200:
          description: Submission completed. Reconciliation results will be available after processing is complete.
          content:
            application/json:
              schema:
                type: object
                properties:
                  boxId:
                    type: string
                    format: guid
                    description: Unique identifier of the PPNS box in use for notifications.
                    example: "1c5b9365-18a6-55a5-99c9-83a091ac7f26"
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/badSubmissionGeneralDeclaration'
                  - $ref: '#/components/schemas/badRequestParameters'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    title: Error Code Types
                    type: string
                    description: Error Code
                    enum:
                      - UNAUTHORIZED
                  message:
                    type: string
                    example: Unauthorized
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/forbiddenSingleError'
                  - $ref: '#/components/schemas/forbiddenMultipleErrors'
        422:
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    title: Error Code Type
                    type: string
                    description: Error Code
                    enum:
                      - MONTHLY_RETURN_NOT_SUBMITTED
                  message:
                    type: string
                    example: "Cannot declare with nilReturn as false when no monthly return data has been submitted"
        500:
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    title: Error Code Type
                    type: string
                    description: Error Code
                    enum:
                      - INTERNAL_SERVER_ERROR
                  message:
                    type: string
                    example: "Unexpected Error"
  /monthly/{zReference}/results:
    get:
      summary: Get report reconciliation results
      description: |
        After processing is complete, use the ‘Get report reconciliation results’ endpoint to retrieve the reconciliation 
        results for the monthly report. The API returns reconciliation results using cursor pagination. These 
        reconciliation results show the records that were rejected, including error messages where applicable.
        
        The cursor and limit query parameters are optional. The limit defaults to 200 records per page. To retrieve the 
        next batch, pass the nextCursor value from the previous response as the cursor parameter.
        
        If the request is successful, the response includes:
        
        - the reconciliation results for the current batch, including record-level identifiers and any reconciliation 
        errors
        - the nextCursor value when more results are available; it is omitted for the final batch
        
        If the reconciliation results are not yet available or the report is not found, the API returns a `404 Not Found` 
        response.

      operationId: getReportReconciliationResults
      tags:
        - Check report results
      security:
        - userRestricted:
            - read:isa-returns
      parameters:
        - name: zReference
          in: path
          description: |
            A unique identifier assigned by HMRC to each approved ISA manager. Format: 'Zxxxx'.
          required: true
          style: simple
          explode: false
          schema:
            pattern: ^[zZ][0-9]{4}$
            type: string
            example: Z1234
        - name: cursor
          in: query
          description: |
            Cursor returned as nextCursor in the previous response. Omit for the first request.
          schema:
            type: string
            example: AbCdEf0123_-xyz
        - name: limit
          in: query
          description: Maximum number of results to return. Defaults to 200.
          schema:
            type: integer
            minimum: 1
            default: 200
            example: 200
        - $ref: '#/components/parameters/acceptHeader'
        - $ref: '#/components/parameters/authorizationHeader'
      responses:
        200:
          description: A batch of reconciliation results from the monthly report.
          content:
            application/json:
              schema:
                type: object
                required:
                  - returnResults
                properties:
                  returnResults:
                    type: array
                    items:
                      $ref: '#/components/schemas/returnResult'
                    description: Reconciliation results in the current batch.
                  nextCursor:
                    type: string
                    description: Encrypted URL-safe cursor for the next batch. Omitted when this is the final batch.
                    example: AbCdEf0123_-xyz
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/badRequestPaginationParameters'
                  - $ref: '#/components/schemas/badRequestPaginationParametersMultipleErrors'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    title: Error Code Type
                    type: string
                    description: Error Code
                    enum:
                      - UNAUTHORIZED
                  message:
                    type: string
                    example: Unauthorized
        404:
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    title: Error Code Types
                    type: string
                    description: Types of errors encountered.
                    enum:
                      - REPORT_NOT_FOUND
                  message:
                    type: string
                    example: Report not found
        500:
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    title: Error Code Type
                    type: string
                    description: Error Code
                    enum:
                      - INTERNAL_SERVER_ERROR
                  message:
                    type: string
                    example: "Unexpected Error"
components:
  securitySchemes:
    userRestricted:
      type: oauth2
      description: |
        HMRC uses OAuth 2.0 Bearer tokens for authentication. Include the token in the AUTHORIZATION header of user-restricted API requests.
        See https://developer.service.hmrc.gov.uk/api-documentation/docs/authorisation/user-restricted-endpoints for details.
      flows:
        authorizationCode:
          authorizationUrl: https://api.service.hmrc.gov.uk/oauth/authorize
          tokenUrl: https://api.service.hmrc.gov.uk/oauth/token
          refreshUrl: https://api.service.hmrc.gov.uk/oauth/refresh
          scopes: {
            "write:isa-returns": "submit data to the api",
            "read:isa-returns": "read data from the api"
          }
  parameters:
    acceptHeader:
      name: Accept
      in: header
      required: true
      schema:
        type: string
        enum: [
          "application/vnd.hmrc.1.0+json"
        ]
    authorizationHeader:
      name: Authorization
      in: header
      required: true
      schema:
        type: string
      description: Bearer token for authentication.
  schemas:
    investorDetailsBase:
      title: Investor Details (Base)
      type: object
      required:
        - accountNumber
        - nino
        - firstName
        - lastName
        - dateOfBirth
        - dateOfLastSubscription
        - totalCurrentYearSubscriptionsToDate
        - marketValueOfAccount
        - amountTransferredIn
        - amountTransferredOut
      properties:
        accountNumber:
          type: string
          description: The account number of the ISA account.
          example: "12345678"
        nino:
          type: string
          description: The National Insurance number of the account holder.
          example: AB123456C
          pattern: ^((?!(BG|GB|KN|NK|NT|TN|ZZ)|(D|F|I|Q|U|V)[A-Z]|[A-Z](D|F|I|O|Q|U|V))[A-Z]{2})[0-9]{6}[A-D]?$
        firstName:
          type: string
          description: The first name of the account holder.
          example: John
        middleName:
          type: string
          description: The middle name of the account holder.
        lastName:
          type: string
          description: The last name of the account holder.
          example: Smith
        dateOfBirth:
          type: string
          format: date
          description: The date of birth of the account holder (YYYY-MM-DD).
          example: 1980-01-01
          pattern: ^\d{4}-\d{2}-\d{2}$
        amountTransferredIn:
          type: number
          format: double
          description: Total value transferred in.
          example: 3000.00
          pattern: ^\d+\.\d{2}$
        amountTransferredOut:
          type: number
          format: double
          description: Total value transferred out.
          example: 3000.00
          pattern: ^\d+\.\d{2}$
        dateOfLastSubscription:
          type: string
          format: date
          description: Date of last subscription to the ISA account (YYYY-MM-DD).
          example: 2025-05-01
          pattern: ^\d{4}-\d{2}-\d{2}$
        totalCurrentYearSubscriptionsToDate:
          type: number
          format: double
          description: Total value of current-year subscriptions to the ISA account.
          example: 5000.00
          pattern: ^\d+\.\d{2}$
        marketValueOfAccount:
          type: number
          format: double
          description: The market value of the ISA account.
          example: 10000.00
          pattern: ^\d+\.\d{2}$
    investorDetails:
        title: Investor Details
        type: object
        anyOf:
          - title: Lifetime ISA - Subscription
            allOf:
              - $ref: '#/components/schemas/investorDetailsBase'
              - type: object
                properties:
                  isaType:
                    type: string
                    description: The type of ISA account.
                    example: LIFETIME
                    enum:
                      - LIFETIME
                  dateOfFirstSubscription:
                    type: string
                    format: date
                    description: Date of first subscription to the ISA account (YYYY-MM-DD).
                    example: 2025-04-06
                    pattern: ^\d{4}-\d{2}-\d{2}$
                  lisaQualifyingAddition:
                    type: number
                    format: double
                    description: The amount of the current subscription that qualifies for a LISA bonus.
                    example: 1000.00
                    pattern: ^-?\d+\.\d{2}$
                  lisaBonusClaim:
                    type: number
                    format: double
                    description: The amount being claimed as a LISA bonus.
                    example: 1000.00
                    pattern: ^-?\d+\.\d{2}$
                required: [ isaType, dateOfFirstSubscription, lisaQualifyingAddition, lisaBonusClaim, amountTransferredIn, amountTransferredOut ]
          - title: Lifetime ISA - Closure
            allOf:
              - $ref: '#/components/schemas/investorDetailsBase'
              - type: object
                properties:
                  isaType:
                    type: string
                    description: The type of ISA account.
                    example: LIFETIME
                    enum:
                      - LIFETIME
                  dateOfFirstSubscription:
                    type: string
                    format: date
                    description: Date of first subscription to the ISA account (YYYY-MM-DD).
                    example: 2025-04-06
                    pattern: ^\d{4}-\d{2}-\d{2}$
                  closureDate:
                    type: string
                    format: date
                    description: ISA account closure date (YYYY-MM-DD).
                    example: 2025-05-15
                    pattern: ^\d{4}-\d{2}-\d{2}$
                  reasonForClosure:
                    type: string
                    description: The reason for the closure of the ISA account.
                    enum:
                      - CANCELLED
                      - CLOSED
                      - VOID
                      - TRANSFERRED_IN_FULL
                      - ALL_FUNDS_WITHDRAWN
                  lisaQualifyingAddition:
                    type: number
                    format: double
                    description: The amount of the current subscription that qualifies for a LISA bonus.
                    example: 1000.00
                    pattern: ^-?\d+\.\d{2}$
                  lisaBonusClaim:
                    type: number
                    format: double
                    description: The amount being claimed as a LISA bonus.
                    example: 1000.00
                    pattern: ^-?\d+\.\d{2}$
                required: [ isaType, dateOfFirstSubscription, closureDate, reasonForClosure, lisaQualifyingAddition, lisaBonusClaim ]
          - title: Standard ISA - Subscription
            allOf:
              - $ref: '#/components/schemas/investorDetailsBase'
              - type: object
                properties:
                  isaType:
                    type: string
                    description: The type of ISA account.
                    enum:
                      - CASH
                      - STOCKS_AND_SHARES
                      - INNOVATIVE_FINANCE
                  flexibleIsa:
                    type: boolean
                    description: Indicates if the ISA account is flexible.
                    example: false
                required: [ isaType, flexibleIsa, amountTransferredIn, amountTransferredOut ]
          - title: Standard ISA - Closure
            allOf:
              - $ref: '#/components/schemas/investorDetailsBase'
              - type: object
                properties:
                  isaType:
                    type: string
                    description: The type of ISA account.
                    example: CASH
                    enum:
                      - CASH
                      - STOCKS_AND_SHARES
                      - INNOVATIVE_FINANCE
                  flexibleIsa:
                    type: boolean
                    description: Indicates if the ISA account is flexible.
                    example: false
                  closureDate:
                    type: string
                    format: date
                    description: ISA account closure date (YYYY-MM-DD).
                    example: 2025-05-15
                    pattern: ^\d{4}-\d{2}-\d{2}$
                  reasonForClosure:
                    type: string
                    description: The reason for the closure of the ISA account.
                    example: VOID
                    enum:
                      - CANCELLED
                      - CLOSED
                      - VOID
                required: [ isaType, flexibleIsa, closureDate, reasonForClosure ]
    returnResult:
      type: object
      properties:
        accountNumber:
          type: string
          description: The account number of the ISA account.
          example: "12345678"
        nino:
          type: string
          description: The National Insurance number of the account holder.
          example: AB123456C
          pattern: ^((?!(BG|GB|KN|NK|NT|TN|ZZ)|(D|F|I|Q|U|V)[A-Z]|[A-Z](D|F|I|O|Q|U|V))[A-Z]{2})[0-9]{6}[A-D]?$
        issueIdentified:
          oneOf:
            - $ref: '#/components/schemas/returnResultOverSubscribed'
            - $ref: '#/components/schemas/returnResultUnableToIdentifyInvestor'
            - $ref: '#/components/schemas/returnResultFailedEligibility'
    returnResultOverSubscribed:
      type: object
      properties:
        code:
          type: string
          description: The result of the report submission.
          enum:
            - OVER_SUBSCRIBED
          example: OVER_SUBSCRIBED
        overSubscribedAmount:
          type: number
          format: double
          description: The amount that was over-subscribed.
          example: 1000.00
          pattern: ^\d+\.\d{2}$
    returnResultUnableToIdentifyInvestor:
      type: object
      properties:
        code:
          type: string
          description: The result of the report submission.
          enum:
            - UNABLE_TO_IDENTIFY_INVESTOR
          example: UNABLE_TO_IDENTIFY_INVESTOR
        message:
          type: string
          description: The reason for the inability to identify the investor.
          example: The National Insurance number provided does not match any records.
    returnResultFailedEligibility:
      type: object
      properties:
        code:
          type: string
          description: The result of the report submission.
          enum:
            - INELIGIBLE
          example: INELIGIBLE
        message:
          type: string
          description: The reason for the state eligibility.
          example: This account holder is too young
    badSubmissionGeneral:
      title: Bad Request (General Issue)
      type: object
      properties:
        code:
          title: Validation Failure Code
          type: string
          description: Code indicating the type of error.
          enum:
            - MISSING_NINO_OR_ACC_NUM
            - INVALID_NINO_OR_ACC_NUM
            - INVALID_Z_REFERENCE
            - MALFORMED_JSON
            - EMPTY_PAYLOAD
        message:
          title: Detailed Message
          type: string
          description: Message describing the details of the validation error.
    badSubmissionGeneralDeclaration:
      title: Bad Request (General Issue)
      type: object
      properties:
        code:
          title: Validation Failure Code
          type: string
          description: Code indicating the type of error.
          enum:
            - MALFORMED_JSON
            - DUPLICATE_FIELD
            - MISSING_NIL_RETURN
        message:
          title: Detailed Message
          type: string
          description: Message describing the details of the validation error.
    badSubmissionComplex:
      title: Bad Request (Field Specific)
      type: object
      properties:
        code:
          title: Validation Failure
          type: string
          description: Code indicating the type of error.
          enum:
            - VALIDATION_FAILURE
        message:
          title: Message
          type: string
          description: Human-readable message outlining the error.
          example: "One or more models failed validation"
        errors:
          title: Errors
          type: array
          description: Array of errors outlining issues found in the format of a record. (This will outline only the first issue.)
          items:
            anyOf:
              - $ref: '#/components/schemas/badSubmissionComplexChild'
    badSubmissionComplexChild:
      title: Bad Request Item
      type: object
      properties:
        nino:
          title: National Insurance Number
          type: string
          description: National Insurance number associated with the record failing validation.
        accountNumber:
          title: Account Number
          type: string
          description: Account Number associated with the record failing validation.
        code:
          title: Validation Failure
          type: string
          description: Code indicating the type of error.
          enum:
            - INVALID_FIELD
            - MISSING_FIELD
            - DUPLICATE_FIELD
        message:
          title: Message
          type: string
          description: Human-readable message outlining the error.
          example: "Last name field is missing"
    badRequestParameters:
      title: Bad Request (Parameters)
      type: object
      properties:
        code:
          title: Parameter Failure Code
          type: string
          description: Code indicating the type of error.
          enum:
            - INVALID_Z_REFERENCE
        message:
          title: Parameter Failure Message
          type: string
          description: Message describing the error in more detail.
          example: Z reference is not formatted correctly
    badRequestPaginationParameters:
      title: Bad Request (Pagination Parameters)
      type: object
      properties:
        code:
          title: Parameter Failure Code
          type: string
          description: Code indicating the type of error.
          enum:
            - INVALID_Z_REFERENCE
            - INVALID_LIMIT
            - INVALID_CURSOR
        message:
          title: Parameter Failure Message
